name: Deploy Laravel App (rsync)

on:
  push:
    branches:
      - main
    paths-ignore:
      - '_bmad/**'
      - '_bmad-output/**'

# Cegah dua deployment berjalan bersamaan ke server yang sama.
# Run yang lebih lama akan dibatalkan saat ada push baru.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # 1. PHP & Composer
      # ------------------------------------------------------------------
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, bcmath, ctype, fileinfo, json, openssl, pdo, pdo_mysql, pdo_sqlite, tokenizer, xml
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      # Catatan: --no-scripts DIHAPUS dari versi lama.
      # Wayfinder memanggil `php artisan` saat `npm run build`, dan artisan
      # butuh package:discover (yang dijalankan oleh script post-autoload-dump)
      # agar service provider paketnya terdaftar.
      - name: Install Composer Dependencies
        run: composer install --no-ansi --no-interaction --no-progress --prefer-dist --optimize-autoloader

      # `php artisan` butuh .env + APP_KEY agar tidak error saat dipanggil Wayfinder
      - name: Prepare .env
        run: |
          cp .env.example .env
          php artisan key:generate

      # ------------------------------------------------------------------
      # 2. Node & build aset
      # ------------------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm ci

      - name: Build Inertia Static Assets
        run: npm run build

      # ------------------------------------------------------------------
      # 3. Test — dijalankan DI RUNNER, bukan di server produksi
      # ------------------------------------------------------------------
      # Sesuaikan bagian env ini dengan setup test-mu. SQLite in-memory adalah
      # default yang aman: tidak ada risiko menyentuh database produksi.
      - name: Run Tests
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          CACHE_STORE: array
          QUEUE_CONNECTION: sync
          SESSION_DRIVER: array
        run: php artisan test

      # - name: Install Playwright
      #   run: npx playwright install chromium --with-deps
      #
      # - name: E2E test
      #   run: npm run test:e2e

      # ------------------------------------------------------------------
      # 4. Kirim aset ke server via rsync (SEBELUM maintenance mode)
      # ------------------------------------------------------------------
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # Untuk keamanan lebih baik, ganti ssh-keyscan dengan host key tetap
          # yang disimpan di secrets: echo "${{ secrets.SSH_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
          ssh-keyscan -p ${{ secrets.SERVER_PORT }} ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      # Aset dikirim ke folder staging `public/build.new`, bukan langsung ke
      # `public/build`. Transfer bisa memakan waktu; situs tetap online dan
      # menyajikan aset lama sampai swap atomik di step berikutnya.
      - name: Sync build assets to staging folder
        run: |
          rsync -az --delete \
            -e "ssh -p ${{ secrets.SERVER_PORT }} -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes" \
            public/build/ \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:htdocs/public/build.new/

      # ------------------------------------------------------------------
      # 5. Deployment di server
      # ------------------------------------------------------------------
      - name: Execute Remote Deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script_stop: true
          script: |
            set -euo pipefail
            cd htdocs

            # Apa pun yang terjadi — sukses maupun gagal di tengah jalan —
            # aplikasi tidak akan tertinggal dalam maintenance mode.
            trap 'php artisan up || true' EXIT

            php artisan down --refresh=15 --retry=60

            git pull origin main

            # Swap atomik: tidak ada momen di mana public/build berisi
            # campuran aset lama dan baru.
            rm -rf public/build.old
            if [ -d public/build ]; then
              mv public/build public/build.old
            fi
            mv public/build.new public/build

            composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

            php artisan migrate --force

            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            # Rollback aset kalau ada langkah di atas yang gagal ditangani
            # trap; hapus cadangan hanya setelah semua berhasil.
            rm -rf public/build.old

      # ------------------------------------------------------------------
      # 6. Verifikasi
      # ------------------------------------------------------------------
      - name: Check the deployed service URL
        uses: jtalk/url-health-check-action@v5
        with:
          url: https://beansjourney.eventaries.cloud
          follow-redirect: false
          max-attempts: 5
          retry-delay: 5s
